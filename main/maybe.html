<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Подождите немного..</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/main/style.css">
    <style>
        #health-spinner {
            position: fixed;
            top: 0; left: 0;
            width: 100vw;
            height: 100vh;
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        #main-content {
            display: none;
        }

        .error-message {
            display: none;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
    </style>
</head>
<body>

    <div id="health-spinner">
        <div class="spinner"></div>
    </div>

    <div id="error-message" class="error-message">Попробуйте позже</div>

    <div id="main-content"></div>

    <script>
        (async function() {
            const spinner = document.getElementById('health-spinner');
            const mainContent = document.getElementById('main-content');
            const errorMessage = document.getElementById('error-message');

            try {
                const response = await fetch('https://graph.maybebot.icu/health', {
                    method: 'GET',
                    headers: { 'Accept': 'application/json' }
                });

                if (!response.ok) throw new Error('Health check failed');

                const data = await response.json();

                if (data && data.status === 'ok') {
                    const pageResponse = await fetch('/main/page-content.html');
                    if (!pageResponse.ok) throw new Error('Page content not found');
                    
                    const html = await pageResponse.text();
                    mainContent.innerHTML = html;
                    mainContent.style.display = 'block';
                    spinner.style.display = 'none';
                } else {
                    throw new Error('Status not ok');
                }
            } catch (error) {
                spinner.style.display = 'none';
                errorMessage.style.display = 'flex';
                errorMessage.style.justifyContent = 'center';
                errorMessage.style.alignItems = 'center';
                errorMessage.style.height = '100vh';
            }
        })();
    </script>
</body>
</html>
